name: CI

# Runs on every push and pull request. Render and Vercel deploy from the same
# pushes, so these checks are what a deploy gate can wait on — see README for
# the two dashboard toggles that turn this signal into an actual gate.
on:
  push:
    branches: [main]
  pull_request:

# A newer push makes an in-flight run irrelevant; cancel it rather than queue.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        # No secrets needed: conftest points the suite at in-memory SQLite and
        # injects fake email and model providers, so CI never touches Neon,
        # Brevo, Gemini or R2.
        run: python -m pytest tests/ -q

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npm test

      - name: Type-check and build
        working-directory: frontend
        # `npm run build` is `tsc -b && vite build`, so this catches type errors
        # as well — the failure mode that actually reaches production.
        run: npm run build
