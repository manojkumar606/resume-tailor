name: CI

# Runs on every push and pull request. Render and Vercel deploy from the same
# pushes, so these checks are what a deploy gate can wait on — see README for
# the two dashboard toggles that turn this signal into an actual gate.
on:
  push:
    branches: [main]
  pull_request:

# A newer push makes an in-flight run irrelevant; cancel it rather than queue.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        # No secrets needed: conftest points the suite at in-memory SQLite and
        # injects fake email and model providers, so CI never touches Neon,
        # Brevo, Gemini or R2.
        run: python -m pytest tests/ -q

  migrations:
    name: Migrations against real Postgres
    runs-on: ubuntu-latest

    # The unit suite runs on SQLite, where enums are just VARCHAR and DDL is
    # forgiving. That gap let a migration reach production and fail there:
    # sa.Enum only emits CREATE TYPE as part of create_table, so an add_column
    # using one aborts on Postgres with "type does not exist". Nothing but a
    # real Postgres could have caught it.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: migrations_check
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/migrations_check
      SECRET_KEY: ci-only-not-a-real-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Upgrade to head
        working-directory: backend
        run: alembic upgrade head

      - name: Round-trip every migration
        working-directory: backend
        # Down to empty and back up again. Catches the classic pair of mistakes:
        # a downgrade that cannot run, and an upgrade that collides with
        # something its own downgrade failed to remove — leftover enum types
        # being the usual culprit.
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Check the models match the migrations
        working-directory: backend
        # A model changed without a migration is invisible until deploy, when
        # the app queries a column the database does not have.
        run: |
          alembic check

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npm test

      - name: Type-check and build
        working-directory: frontend
        # `npm run build` is `tsc -b && vite build`, so this catches type errors
        # as well — the failure mode that actually reaches production.
        run: npm run build
